name: Live Baidu AI Studio PaddleOCR E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-studio-live:
    # Never run repository secrets on untrusted pull_request code.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests pillow
      - name: Verify official API JSONL fixtures locally
        run: python scripts/paddleocr_live_e2e.py --selftest
      - name: Run all three real PaddleOCR models and invalid-token check
        env:
          PADDLEOCR_ACCESS_TOKEN: ${{ secrets.PADDLEOCR_ACCESS_TOKEN }}
          PADDLEOCR_API_URL: https://paddleocr.aistudio-app.com/api/v2/ocr/jobs
        run: python scripts/paddleocr_live_e2e.py --live
