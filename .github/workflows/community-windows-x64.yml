name: Community Windows x64 installer and beta release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - snow_shot/**
      - snow-crates/**
      - cmake/**
      - scripts/**
      - .github/workflows/community-windows-x64.yml
  push:
    tags:
      - 'v*.*.*-beta.*_snow-shot'

# PR builds never receive publication credentials.
permissions:
  contents: read

concurrency:
  group: community-windows-x64-${{ github.ref }}
  # Supersede outdated PR builds; release tag builds must never be interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-full-installer:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify version, safety policy and offline API contracts
        shell: pwsh
        run: |
          python scripts/test-upstream-sync.py
          python scripts/upstream_sync.py verify-deletions
          python scripts/test-community-branding.py
          python scripts/paddleocr_live_e2e.py --selftest
          python scripts/community_release.py selftest
          python scripts/test-community-rust-compat.py
      - name: Verify release tag is reviewed and matches CMake
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          python scripts/community_release.py validate-tag --tag "$GITHUB_REF_NAME"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Install pinned vcpkg, Rust and OCR build dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -Preset snow-shot-msvc-release -VcpkgVariants Static -SkipQtValidation
      - name: Restore previously built static Qt cache
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: .tools/qt/6.12.0/x64-static-release
          key: community-qt-6.12.0-x64-release-${{ hashFiles('scripts/qt-toolchain.json', 'scripts/static-qt-features.json', 'scripts/qtbase-*.patch', 'vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Build or validate audited Qt 6.12.0 Release kit
        shell: pwsh
        run: |
          $prefix = Join-Path $PWD '.tools/qt/6.12.0/x64-static-release'
          ./scripts/build-static-qt.ps1 -InstallPrefix $prefix -Architecture x64 -Configuration Release -DevelopmentModules -Parallelism 8
          if ($LASTEXITCODE -ne 0) { throw 'Audited static Qt build failed' }
          $qt6Dir = Join-Path $prefix 'lib/cmake/Qt6'
          if (-not (Test-Path (Join-Path $qt6Dir 'Qt6Config.cmake'))) {
            throw 'Validated Qt6Config.cmake missing'
          }
          "SNOW_QT_STATIC_DIR=$qt6Dir" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "Qt6_DIR=$qt6Dir" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      # Cache the validated kit *before* the full C++/Rust compilation. GitHub
      # would otherwise skip its post-job cache save when a later build fails.
      - name: Save audited static Qt kit for future Windows builds
        if: steps.qt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .tools/qt/6.12.0/x64-static-release
          key: community-qt-6.12.0-x64-release-${{ hashFiles('scripts/qt-toolchain.json', 'scripts/static-qt-features.json', 'scripts/qtbase-*.patch', 'vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Build full Windows x64 (Mini disabled in release preset)
        shell: pwsh
        run: ./scripts/build.ps1 -Preset snow-shot-msvc-release
      - name: Confirm no Mini build was configured
        shell: pwsh
        run: |
          $cache = 'build/snow-shot-msvc-release/CMakeCache.txt'
          if (-not (Select-String -LiteralPath $cache -Pattern '^SNOW_APPS_BUILD_SNOW_SHOT_MINI:BOOL=OFF$' -Quiet)) {
            throw 'Snow Shot Mini must never be compiled for this community beta'
          }
      - name: Package full Windows x64 NSIS installers only
        shell: pwsh
        run: ./scripts/package-snow-shot.ps1 -Architecture x64 -SkipBuild -FullOnly
      - name: Verify native installer manifests and SHA-256 files
        shell: pwsh
        run: python scripts/community_release.py verify-assets --directory build/snow-shot-msvc-release --allow-build-intermediates
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: community-windows-x64-${{ github.sha }}
          path: |
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-online.exe
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-offline.exe
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-*.exe.sha256
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-online.manifest.json
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-offline.manifest.json
          if-no-files-found: error

  # The separate PR contract workflow does not run for tag pushes. Re-run the
  # actual Qt C++ client tests here so a release cannot bypass three-model tests.
  verify-paddleocr-contract:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt Core/GUI/Network
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev
      - name: Compile actual PaddleOCR C++ client
        run: |
          cmake -S tests/standalone-paddleocr -B build/community-paddleocr-contract -DCMAKE_BUILD_TYPE=Release
          cmake --build build/community-paddleocr-contract --parallel 4
      - name: Run three-model contract and Markdown clipboard tests
        run: ctest --test-dir build/community-paddleocr-contract --output-on-failure

  # Only a tag on an already-reviewed main commit, after verified Windows and
  # actual PaddleOCR contract tests, may obtain contents:write.
  publish-beta-release:
    needs: [build-full-installer, verify-paddleocr-contract]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: community-windows-x64-${{ github.sha }}
          path: dist
      - name: Verify release tag and downloaded installer integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/community_release.py validate-tag --tag "$GITHUB_REF_NAME"
          python3 scripts/community_release.py verify-assets --directory dist
      - name: Create GitHub Prerelease with x64 Full only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/community_release.py version)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/snow-shot-$version-windows-x64-online.exe" \
            "dist/snow-shot-$version-windows-x64-online.exe.sha256" \
            "dist/snow-shot-$version-windows-x64-online.manifest.json" \
            "dist/snow-shot-$version-windows-x64-offline.exe" \
            "dist/snow-shot-$version-windows-x64-offline.exe.sha256" \
            "dist/snow-shot-$version-windows-x64-offline.manifest.json" \
            --verify-tag --prerelease \
            --title "Snow Shot Community $version (Windows x64 Beta)" \
            --notes-file docs/community-release-notes.md
