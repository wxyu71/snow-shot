name: Community Windows x64 installer and beta release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - snow_shot/**
      - snow-crates/**
      - snow-draw-engine-gpui/**
      - snow_draw_engine_qt/**
      - snow-image-rs/**
      - snow_rust_ffi/**
      - cmake/**
      - scripts/**
      - .github/workflows/community-windows-x64.yml
  push:
    tags:
      - 'v*.*.*-beta.*_snow-shot'

# PR builds never receive publication credentials.
permissions:
  contents: read

concurrency:
  group: community-windows-x64-${{ github.ref }}
  # Supersede outdated PR builds; release tag builds must never be interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast checks must succeed before allocating a multi-hour Windows runner.
  # Run concurrently with the actual Qt PaddleOCR contract job below.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate repository safety, Rust and C++ API contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-upstream-sync.py
          python3 scripts/upstream_sync.py verify-deletions
          python3 scripts/test-qt-cmake-contract.py
          python3 scripts/test-community-branding.py
          python3 scripts/paddleocr_live_e2e.py --selftest
          python3 scripts/community_release.py selftest
          python3 scripts/test-community-rust-compat.py
          python3 scripts/test-community-cpp-api-contract.py
          python3 scripts/test-community-nsis-toolchain.py
          python3 scripts/test-community-package-modes.py
      - name: Reject unreviewed or incorrectly versioned beta tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/community_release.py validate-tag --tag "$GITHUB_REF_NAME"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

  build-full-installer:
    # Failure of either fast gate skips the costly native build, not its tests.
    needs: [preflight, verify-paddleocr-contract]
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify release tag is reviewed and matches CMake
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          python scripts/community_release.py validate-tag --tag "$GITHUB_REF_NAME"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      # #30 already compiled successfully but failed at package-time due to a
      # mismatched Mini=ON cache expectation. Execute real PowerShell mode
      # expressions with synthetic cases before expensive dependency bootstrap.
      - name: Run actual FullOnly/Store/Mini packaging mode tests
        shell: pwsh
        run: ./scripts/test-community-package-mode.ps1
      # Fail early if packaging tools are missing or broken. #29 fully built
      # snow_shot.exe but failed at the very end because makensis was absent.
      - name: Bootstrap pinned NSIS 3.12 and run CPack smoke test
        shell: pwsh
        run: ./scripts/bootstrap-community-nsis.ps1
      # The previous build spent 21 minutes rebuilding 33 pinned vcpkg
      # packages even though the audited Qt kit was already cached.
      - name: Restore verified vcpkg binary archive cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .tools/vcpkg-binary-cache
          key: community-vcpkg-x64-static-${{ hashFiles('scripts/bootstrap.ps1', 'scripts/build-toolchain.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}
      - name: Enable vcpkg archive reuse with pinned manifests
        shell: pwsh
        run: |
          $cache = Join-Path $PWD '.tools/vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Restore cached Cargo registry and git sources
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: community-cargo-x64-${{ hashFiles('snow-crates/Cargo.lock', 'snow_draw_engine_qt/Cargo.lock', 'snow_rust_ffi/Cargo.lock', 'snow-image-rs/Cargo.lock', 'snow_shot/rust/snow-shot-mcp/Cargo.lock', 'scripts/snow-ocr-toolchain.ps1', 'scripts/build-toolchain.json') }}
      - name: Install pinned vcpkg, Rust and OCR build dependencies
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -Preset snow-shot-msvc-release -VcpkgVariants Static -SkipQtValidation
      # Save after successful dependency installation, independently of whether
      # later application compilation succeeds. Cache errors are non-blocking.
      - name: Save vcpkg binary archives for subsequent builds
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .tools/vcpkg-binary-cache
          key: community-vcpkg-x64-static-${{ hashFiles('scripts/bootstrap.ps1', 'scripts/build-toolchain.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}
      - name: Restore previously built static Qt cache
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: .tools/qt/6.12.0/x64-static-release
          key: community-qt-6.12.0-x64-release-${{ hashFiles('scripts/qt-toolchain.json', 'scripts/static-qt-features.json', 'scripts/qtbase-*.patch', 'vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Build or validate audited Qt 6.12.0 Release kit
        shell: pwsh
        run: |
          $prefix = Join-Path $PWD '.tools/qt/6.12.0/x64-static-release'
          ./scripts/build-static-qt.ps1 -InstallPrefix $prefix -Architecture x64 -Configuration Release -DevelopmentModules -Parallelism 8
          if ($LASTEXITCODE -ne 0) { throw 'Audited static Qt build failed' }
          $qt6Dir = Join-Path $prefix 'lib/cmake/Qt6'
          if (-not (Test-Path (Join-Path $qt6Dir 'Qt6Config.cmake'))) {
            throw 'Validated Qt6Config.cmake missing'
          }
          "SNOW_QT_STATIC_DIR=$qt6Dir" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "Qt6_DIR=$qt6Dir" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      # Cache the validated kit *before* the full C++/Rust compilation. GitHub
      # would otherwise skip its post-job cache save when a later build fails.
      - name: Save audited static Qt kit for future Windows builds
        if: steps.qt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .tools/qt/6.12.0/x64-static-release
          key: community-qt-6.12.0-x64-release-${{ hashFiles('scripts/qt-toolchain.json', 'scripts/static-qt-features.json', 'scripts/qtbase-*.patch', 'vcpkg.json', 'vcpkg-configuration.json') }}
      # Cache exact native CMake/MSVC/Rust outputs only for PR builds, never
      # consume a PR-built binary for a reviewed tag release. The native build
      # command still runs after restoration to verify all inputs and targets.
      # Packaging-only script changes intentionally do not alter this key.
      - name: Restore cached native CMake and Rust build outputs
        if: github.event_name == 'pull_request'
        id: native-build-cache
        uses: actions/cache/restore@v4
        with:
          path: build/snow-shot-msvc-release
          key: community-windows-native-x64-v1-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'vcpkg*.json', 'cmake/**', 'snow_shot/**', 'snow-crates/**', 'snow-draw-engine-gpui/**', 'snow_draw_engine_qt/**', 'snow-image-rs/**', 'snow_rust_ffi/**', 'ant_design_qt/**', 'scripts/build.ps1', 'scripts/snow-build-environment.ps1', 'scripts/build-toolchain.json', 'scripts/qt-toolchain.json', 'scripts/static-qt-features.json', 'scripts/qtbase-*.patch') }}
      - name: Build full Windows x64 (Mini disabled in release preset)
        shell: pwsh
        # bootstrap.ps1 already installed and validated pinned dependencies.
        # Avoid a second vcpkg/rustup/cargo initialization pass.
        run: ./scripts/build.ps1 -Preset snow-shot-msvc-release -SkipBootstrap
      - name: Save Cargo sources even when native compilation reports errors
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: community-cargo-x64-${{ hashFiles('snow-crates/Cargo.lock', 'snow_draw_engine_qt/Cargo.lock', 'snow_rust_ffi/Cargo.lock', 'snow-image-rs/Cargo.lock', 'snow_shot/rust/snow-shot-mcp/Cargo.lock', 'scripts/snow-ocr-toolchain.ps1', 'scripts/build-toolchain.json') }}
      - name: Confirm no Mini build was configured
        shell: pwsh
        run: |
          $cache = 'build/snow-shot-msvc-release/CMakeCache.txt'
          if (-not (Select-String -LiteralPath $cache -Pattern '^SNOW_APPS_BUILD_SNOW_SHOT_MINI:BOOL=OFF$' -Quiet)) {
            throw 'Snow Shot Mini must never be compiled for this community beta'
          }
      # Save a compilation-success checkpoint before risky packaging: the
      # same PR can reuse CMakeCache, MSVC objects and Rust outputs after a
      # packaging-only fix instead of recompiling for 90 minutes.
      - name: Save successful native build before packaging
        if: github.event_name == 'pull_request' && steps.native-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/snow-shot-msvc-release
          key: community-windows-native-x64-v1-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'vcpkg*.json', 'cmake/**', 'snow_shot/**', 'snow-crates/**', 'snow-draw-engine-gpui/**', 'snow_draw_engine_qt/**', 'snow-image-rs/**', 'snow_rust_ffi/**', 'ant_design_qt/**', 'scripts/build.ps1', 'scripts/snow-build-environment.ps1', 'scripts/build-toolchain.json', 'scripts/qt-toolchain.json', 'scripts/static-qt-features.json', 'scripts/qtbase-*.patch') }}
      # A failed packaging step must not erase evidence that compilation did
      # succeed. This EXE is diagnostic, NOT a distributable installer.
      - name: Preserve compiled Full EXE after native build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: community-x64-compiled-exe-${{ github.sha }}
          path: build/snow-shot-msvc-release/snow_shot/Release/snow_shot.exe
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Package full Windows x64 NSIS installers only
        shell: pwsh
        run: ./scripts/package-snow-shot.ps1 -Architecture x64 -SkipBuild -FullOnly
      - name: Verify native installer manifests and SHA-256 files
        shell: pwsh
        run: python scripts/community_release.py verify-assets --directory build/snow-shot-msvc-release --allow-build-intermediates
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: community-windows-x64-${{ github.sha }}
          path: |
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-online.exe
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-offline.exe
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-*.exe.sha256
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-online.manifest.json
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-offline.manifest.json
          if-no-files-found: error

  # Run the actual C++/Qt contract tests on PRs and tags, in parallel with
  # the fast Python preflight and before Windows dependency installation.
  verify-paddleocr-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt Core/GUI/Network
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev
      - name: Compile actual PaddleOCR C++ client
        run: |
          cmake -S tests/standalone-paddleocr -B build/community-paddleocr-contract -DCMAKE_BUILD_TYPE=Release
          cmake --build build/community-paddleocr-contract --parallel 4
      - name: Run three-model contract and Markdown clipboard tests
        run: ctest --test-dir build/community-paddleocr-contract --output-on-failure

  # Only a tag on an already-reviewed main commit, after verified Windows and
  # actual PaddleOCR contract tests, may obtain contents:write.
  publish-beta-release:
    needs: [build-full-installer, verify-paddleocr-contract]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: community-windows-x64-${{ github.sha }}
          path: dist
      - name: Verify release tag and downloaded installer integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/community_release.py validate-tag --tag "$GITHUB_REF_NAME"
          python3 scripts/community_release.py verify-assets --directory dist
      - name: Create GitHub Prerelease with x64 Full only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/community_release.py version)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/snow-shot-$version-windows-x64-online.exe" \
            "dist/snow-shot-$version-windows-x64-online.exe.sha256" \
            "dist/snow-shot-$version-windows-x64-online.manifest.json" \
            "dist/snow-shot-$version-windows-x64-offline.exe" \
            "dist/snow-shot-$version-windows-x64-offline.exe.sha256" \
            "dist/snow-shot-$version-windows-x64-offline.manifest.json" \
            --verify-tag --prerelease \
            --title "Snow Shot Community $version (Windows x64 Beta)" \
            --notes-file docs/community-release-notes.md
