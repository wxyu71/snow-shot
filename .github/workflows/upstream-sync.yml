name: Upstream sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check optional GitHub App credentials
        id: app_config
        env:
          APP_ID: ${{ secrets.UPSTREAM_SYNC_APP_ID }}
          APP_KEY: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$APP_ID" && -n "$APP_KEY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$APP_ID" || -n "$APP_KEY" ]]; then
            echo '::error::Supply BOTH UPSTREAM_SYNC_APP_ID and UPSTREAM_SYNC_APP_PRIVATE_KEY.'
            exit 1
          fi

      - name: Mint short-lived GitHub App token
        id: app_token
        if: steps.app_config.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app_token.outputs.token || secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Test sync invariants
        run: python3 scripts/test-upstream-sync.py

      - name: Update rolling upstream integration PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep the temporary token out of the checkout's persisted git config.
          # The GitHub CLI credential helper authenticates fetch/push using GH_TOKEN.
          gh auth setup-git --hostname github.com
          python3 scripts/upstream_sync.py sync
