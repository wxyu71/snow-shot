name: Upstream sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and classify official upstream
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mg-chao/snow-shot.git
          git fetch --no-tags upstream main
          python3 scripts/test-upstream-sync.py
          python3 scripts/upstream_sync.py verify-deletions
          python3 scripts/upstream_sync.py classify --upstream upstream/main --output "$RUNNER_TEMP/sync.json"
          echo "mode=$(jq -r .mode "$RUNNER_TEMP/sync.json")" >> "$GITHUB_OUTPUT"

      - name: Apply safe sync or update the review candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CLASSIFIED_MODE: ${{ steps.classify.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(jq -r .upstream_commit "$RUNNER_TEMP/sync.json")"
          reasons="$(jq -r '.reasons[]? | "- " + .' "$RUNNER_TEMP/sync.json")"

          if [[ "$CLASSIFIED_MODE" == "noop" ]]; then
            exit 0
          fi

          if [[ "$CLASSIFIED_MODE" == "auto" ]]; then
            if git merge --no-commit --no-ff upstream/main; then
              if python3 scripts/upstream_sync.py verify-deletions; then
                git commit -m "chore(sync): integrate upstream main"
                git push origin HEAD:main
                exit 0
              fi
              git reset --hard origin/main
            else
              git merge --abort
            fi
            reasons="$(printf '%s\n- %s' "$reasons" \
              'Automatic documentation merge could not be verified; inspect the real merge candidate.')"
          fi

          # A human-resolved upstream PR is authoritative. Never overwrite its head.
          # Pending review is not a sync failure, even if upstream advances again.
          existing_review="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main \
            --state open --limit 100 --json number,headRefName \
            --jq '[.[] | select((.headRefName | startswith("review/upstream-main-")) or
              (.headRefName | startswith("automation/upstream-review-")) or
              .headRefName == "automation/upstream-review") | .number] | first // empty')"
          if [[ -n "$existing_review" ]]; then
            {
              echo "### Upstream integration is awaiting manual review"
              echo "- Latest upstream: $upstream_sha"
              echo "- Existing review: https://github.com/${GITHUB_REPOSITORY}/pull/${existing_review}"
              echo "- **No changes were merged into main.** Update the existing PR manually."
              echo "- Automation deliberately did not change the reviewed PR branch."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Pending upstream review::Review PR #${existing_review} against upstream ${upstream_sha}; existing PR head was preserved."
            exit 0
          fi

          base_sha="$(git rev-parse origin/main)"
          # Deterministic per upstream/base pair: safe to retry, never force-push
          # an existing branch, and never replace human commits.
          branch="automation/upstream-review-${upstream_sha:0:12}-${base_sha:0:8}"
          conflict_files=""
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            candidate="An existing review branch is reused unchanged. Inspect it before merging; it may contain prior manual work."
          else
            git switch -C "$branch" origin/main
            if git merge --no-ff --no-edit upstream/main; then
              candidate="This branch contains a real two-parent Git merge of upstream into Community. Review its changes and validate the normal PR checks."
            else
              conflict_files="$(git diff --name-only --diff-filter=U)"
              if [[ -z "$conflict_files" ]]; then
                echo "::error::Upstream merge failed for a reason other than file conflicts."
                exit 1
              fi
              git merge --abort
              # A report-only commit is NOT a sync candidate. Instead, push the
              # actual upstream commit. GitHub will mark the PR as conflicting,
              # and resolving it will preserve the real upstream ancestry.
              git switch -C "$branch" upstream/main
              candidate="GitHub should show a real merge conflict: this branch points at upstream/main, not a dummy report. Merge Community main INTO this review branch, resolve conflicts, test, and push. Do not merge before resolving conflicts and reviewing the Community protection policy."
            fi
            git push origin "HEAD:refs/heads/$branch"
          fi

          body="$(printf '## Upstream integration (manual review required)\n\nUpstream: mg-chao/snow-shot@%s\nFork main at detection: %s\nReview branch: %s\n\n%s\n\n### Policy reasons\n%s\n\n### Conflicted files (if detected this run)\n%s\n\n### Resolve locally\n\n1. Fetch the review branch and main from this fork, and upstream/main.\n2. Check out the review branch, then run git merge origin/main if it is based on upstream; resolve any conflicts carefully and commit.\n3. Run Community policy checks and native CI, then push to the SAME review branch.\n4. Merge only after reviewing protected Community OCR, account-removal, updater, version, and packaging behavior.\n\n**Never merge the initial conflict branch without resolving it. No changes were merged to main by this workflow.**\n' \
            "$upstream_sha" "$base_sha" "$branch" "$candidate" "$reasons" "$conflict_files")"

          if ! create_output="$(gh pr create --draft --repo "$GITHUB_REPOSITORY" \
            --base main --head "$branch" \
            --title "review(sync): integrate upstream ${upstream_sha:0:12}" --body "$body" 2>&1)"; then
            if [[ "$create_output" == *"GitHub Actions is not permitted to create or approve pull requests"* ]]; then
              {
                echo "### Manual upstream sync PR required"
                echo "- Upstream: $upstream_sha"
                echo "- Review branch: $branch"
                echo "- Create a draft PR: https://github.com/${GITHUB_REPOSITORY}/pull/new/${branch}"
                echo "- **No changes were merged into main.**"
                echo "- Enable Actions PR creation in repository settings (if disabled)."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=PR creation restricted::Review branch $branch was preserved; manually open a draft PR."
              exit 0
            fi
            printf '%s\n' "$create_output" >&2
            exit 1
          fi
          {
            echo "### Upstream integration requires review"
            echo "- PR: $create_output"
            echo "- Latest upstream: $upstream_sha"
            echo "- Review branch: $branch"
            echo "- **No changes were merged into main.**"
            echo "- PR CI created by GITHUB_TOKEN may need a maintainer to approve workflow runs."
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$create_output"
