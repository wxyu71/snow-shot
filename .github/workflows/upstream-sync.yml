name: Upstream sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch and classify official upstream
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          upstream_repo="$(python3 -c 'import json; print(json.load(open(".github/upstream-protection.json", encoding="utf-8"))["upstream"])')"
          git remote add upstream "https://github.com/${upstream_repo}.git"
          git fetch --no-tags upstream main
          python3 scripts/test-upstream-sync.py
          python3 scripts/upstream_sync.py verify-deletions
          python3 scripts/upstream_sync.py classify --upstream upstream/main --output "$RUNNER_TEMP/sync.json"
          echo "mode=$(jq -r .mode "$RUNNER_TEMP/sync.json")" >> "$GITHUB_OUTPUT"

      - name: Apply safe sync or update the review candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CLASSIFIED_MODE: ${{ steps.classify.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(jq -r .upstream_commit "$RUNNER_TEMP/sync.json")"
          reasons="$(jq -r '.reasons[]? | "- " + .' "$RUNNER_TEMP/sync.json")"

          if [[ "$CLASSIFIED_MODE" == "noop" ]]; then
            exit 0
          fi

          if [[ "$CLASSIFIED_MODE" == "auto" ]]; then
            if git merge --no-commit --no-ff upstream/main; then
              if python3 scripts/upstream_sync.py verify-deletions; then
                git commit -m "chore(sync): integrate upstream main"
                git push origin HEAD:main
                exit 0
              fi
              git reset --hard origin/main
            else
              git merge --abort
            fi
            reasons="$(printf '%s\n- %s' "$reasons" \
              'Automatic documentation merge could not be verified; inspect the real merge candidate.')"
          fi

          # A manually reconciled upstream sync PR may already be in review.
          # Do not open a duplicate conflict-report PR or replace its head.
          existing_review="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main \
            --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("review/upstream-main-")) | .number] | first // empty')"
          if [[ -n "$existing_review" ]]; then
            {
              echo "### Upstream synchronization needs manual review"
              echo "- Current upstream: $upstream_sha"
              echo "- Existing review: https://github.com/${GITHUB_REPOSITORY}/pull/${existing_review}"
              echo "- **No changes were merged into main.** Update the review PR before merging."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Existing upstream review::PR #${existing_review} is open; review new upstream commit ${upstream_sha} there."
            exit 0
          fi

          branch="automation/upstream-review"
          git switch -C "$branch" origin/main
          if git merge --no-ff --no-edit upstream/main; then
            candidate="The branch contains the actual upstream merge candidate. Review it and let the normal PR CI validate the integrated tree."
            rm -f .github/upstream-review-pending.md
          else
            git merge --abort
            candidate="The upstream merge has conflicts. This branch contains only the conflict report; resolve the upstream merge manually before merging the PR."
            printf '%s\n\n%s\n\n%s\n' \
              '# Upstream synchronization requires conflict resolution' \
              "Upstream commit: $upstream_sha" \
              "$reasons" > .github/upstream-review-pending.md
            git add .github/upstream-review-pending.md
            git commit -m "chore(sync): report upstream merge conflict"
          fi

          git push --force origin "$branch"
          body="$(printf 'Upstream commit: %s\n\n%s\n\nReasons reported by the fork policy:\n%s' \
            "$upstream_sha" "$candidate" "$reasons")"

          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main \
            --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
              --title "review(sync): integrate upstream main" --body "$body"
          else
            if ! create_output="$(gh pr create --draft --repo "$GITHUB_REPOSITORY" \
              --base main --head "$branch" \
              --title "review(sync): integrate upstream main" --body "$body" 2>&1)"; then
              if [[ "$create_output" == *"GitHub Actions is not permitted to create or approve pull requests"* ]]; then
                {
                  echo "### Manual upstream sync PR required"
                  echo "- Upstream: $upstream_sha"
                  echo "- Review branch: $branch"
                  echo "- Create a draft PR: https://github.com/${GITHUB_REPOSITORY}/pull/new/${branch}"
                  echo "- **No changes were merged into main.**"
                  echo "- To enable automation, allow GitHub Actions to create pull requests in repository Actions settings."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::warning title=GitHub Actions PR creation disabled::Review branch $branch was pushed; manually open a draft PR or enable repository Actions PR creation."
                exit 0
              fi
              printf '%s\n' "$create_output" >&2
              exit 1
            fi
            printf '%s\n' "$create_output"
          fi
